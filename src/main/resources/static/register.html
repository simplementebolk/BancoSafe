<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - BancoSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Barra de navegación -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shield-lock-fill text-primary"></i> BancoSafe</a>
        <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
    </div>
</nav>

<!-- Formulario de Registro -->
<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill text-primary display-4"></i>
                        <h2 class="fw-bold mt-2">Crear Cuenta</h2>
                        <p class="text-muted small">Únete a BancoSafe en pocos pasos</p>
                    </div>

                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label text-muted small fw-semibold">Nombre</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellido" class="form-label text-muted small fw-semibold">Apellido</label>
                                <input type="text" class="form-control" id="apellido" placeholder="Tu apellido" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="reg-email" class="form-label text-muted small fw-semibold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="reg-email" placeholder="tucorreo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="reg-password" class="form-label text-muted small fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="reg-password" placeholder="Crea una contraseña segura" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">Registrarse</button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted small">¿Ya tienes una cuenta? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Inicia sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
